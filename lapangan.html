<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirim Lokasi Karyawan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f6f9;
      text-align: center;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 0 auto;
    }
    input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      box-sizing: border-box;
    }
    /* Tampilan khusus saat input terkunci */
    input:disabled {
      background-color: #e9ecef;
      color: #495057;
      border-color: #ced4da;
      font-weight: bold;
    }
    button {
      width: 90%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:disabled {
      background-color: #6c757d;
    }
    #status {
      margin-top: 15px;
      font-size: 14px;
      word-break: break-all;
    }
    .reset-btn {
      background: none;
      border: none;
      color: #dc3545;
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 15px;
      width: auto;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Absen Lokasi Karyawan</h2>
    <p style="color: #666; font-size: 14px;">Pastikan GPS HP Anda sudah aktif.</p>

    <label for="nama" style="display:block; text-align:left; margin-left:5%; font-size:12px; color:#555;">Nama / ID Karyawan:</label>
    <input type="text" id="nama" placeholder="Masukkan Nama/ID Anda">

    <button id="btnKirim" onclick="kirimLokasiHP()">📍 Kirim Lokasi Saya</button>

    <div id="status"></div>

    <!-- Tombol darurat jika admin mau mengganti nama yang terkunci -->
    <button id="btnReset" class="reset-btn" onclick="resetNama()" style="display:none;">⚠️ Ganti Nama / Reset ID</button>
  </div>

  <script>
    const SUPABASE_URL = "https://gjwuxgoyaaedlgmvjfoh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6fqAKuhYh6qXFPTQi5g3hg_Md9Q7Pjb";

    // Fungsi untuk mengecek dan mengunci input saat halaman dimuat
    function periksaDanKunciNama() {
      const inputNama = document.getElementById('nama');
      const btnReset = document.getElementById('btnReset');
      const savedName = localStorage.getItem('karyawan_id');

      if (savedName && savedName.trim() !== "") {
        inputNama.value = savedName;
        inputNama.disabled = true; // Kunci input text
        btnReset.style.display = "inline-block"; // Tampilkan tombol reset/ganti ID
      }
    }

    // Jalankan langsung fungsi cek saat script dimuat
    periksaDanKunciNama();
    window.addEventListener('DOMContentLoaded', periksaDanKunciNama);

    function kirimLokasiHP() {
      const inputNama = document.getElementById('nama');
      const nama = inputNama.value.trim();
      const statusDiv = document.getElementById('status');
      const btn = document.getElementById('btnKirim');

      if (!nama) {
        statusDiv.innerHTML = "❌ <b style='color:red;'>Isi Nama/ID terlebih dahulu!</b>";
        return;
      }

      // 1. Simpan ke memori lokal HP & Kunci Input
      localStorage.setItem('karyawan_id', nama);
      periksaDanKunciNama();

      // 2. Cek fitur Geolocation
      if (!navigator.geolocation) {
        statusDiv.innerHTML = "❌ Browser HP Anda tidak mendukung GPS.";
        return;
      }

      btn.disabled = true;
      statusDiv.innerHTML = "⏳ Mencari sinyal GPS HP...";

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          statusDiv.innerHTML = "⏳ Mengirim lokasi ke database...";

          try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/lokasi_karyawan`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`
              },
              body: JSON.stringify({
                user_id: nama,
                latitude: lat,
                longitude: lng
              })
            });

            if (response.ok) {
              statusDiv.innerHTML = `✅ <b style='color:green;'>Berhasil Terkirim!</b><br>Lat: ${lat}<br>Lng: ${lng}`;
            } else {
              statusDiv.innerHTML = "❌ Gagal menyimpan data ke database.";
            }
          } catch (err) {
            statusDiv.innerHTML = `❌ Error: ${err.message}`;
          } finally {
            btn.disabled = false;
          }
        },
        (error) => {
          btn.disabled = false;
          if (error.code === error.PERMISSION_DENIED) {
            statusDiv.innerHTML = "❌ <b style='color:red;'>Izin GPS Ditolak!</b><br>Harap izinkan akses lokasi di HP Anda.";
          } else {
            statusDiv.innerHTML = `❌ Gagal mengambil GPS: ${error.message}`;
          }
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    // Fungsi jika Admin/Karyawan benar-benar butuh mengubah ID
    function resetNama() {
      if (confirm("Apakah Anda yakin ingin mengganti Nama/ID di HP ini?")) {
        localStorage.removeItem('karyawan_id');
        const inputNama = document.getElementById('nama');
        inputNama.disabled = false;
        inputNama.value = "";
        document.getElementById('btnReset').style.display = "none";
        document.getElementById('status').innerHTML = "ℹ️ Nama berhasil di-reset. Silakan masukkan nama baru.";
      }
    }
  </script>

</body>
</html>
