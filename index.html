<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoring Lokasi Karyawan</title>
  
  <!-- CSS Leaflet Peta -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
    h2 { color: #333; margin-bottom: 5px; }
    p.subtitle { color: #666; margin-top: 0; margin-bottom: 20px; }
    #map { height: 450px; width: 100%; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
    th { background-color: #007bff; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    .btn { padding: 10px 15px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 6px; font-weight: bold; margin-bottom: 15px; }
    .btn:hover { background: #218838; }
  </style>
</head>
<body>

  <h2>Dashboard Monitoring Lokasi Karyawan</h2>
  <p class="subtitle">Live Tracking rute perjalanan karyawan (Posisi Awal 🟢, Singgah 🟡, & Terakhir 🔴).</p>
  
  <button class="btn" onclick="muatData()">Refresh Data</button>

  <!-- Peta -->
  <div id="map"></div>

  <h3>Riwayat Pengiriman Lokasi Hari Ini</h3>
  <table>
    <thead>
      <tr>
        <th>Waktu Kirim</th>
        <th>User ID / Nama Karyawan</th>
        <th>Latitude</th>
        <th>Longitude</th>
      </tr>
    </thead>
    <tbody id="tabel-data">
      <tr><td colspan="4">Memuat data...</td></tr>
    </tbody>
  </table>

  <!-- JS Leaflet Peta -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const SUPABASE_URL = "https://gjwuxgoyaaedlgmvjfoh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6fqAKuhYh6qXFPTQi5g3hg_Md9Q7Pjb";

    let isFirstLoad = true;

    // Inisialisasi Peta
    const map = L.map('map').setView([-2.5489, 118.0149], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let markersGroup = L.layerGroup().addTo(map);

    // Palet warna cerah ala GoJek / Google Maps untuk membedakan antar karyawan
    const warnaKaryawan = ['#00880C', '#007bff', '#e83e8c', '#fd7e14', '#6f42c1', '#17a2b8'];

    async function muatData() {
      const tbody = document.getElementById('tabel-data');
      
      try {
        const today = new Date().toISOString().split('T')[0];

        const response = await fetch(`${SUPABASE_URL}/rest/v1/lokasi_karyawan?select=*&created_at=gte.${today}&order=created_at.asc`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });

        const data = await response.json();
        tbody.innerHTML = '';
        markersGroup.clearLayers();

        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4">Belum ada data masuk untuk hari ini.</td></tr>';
          return;
        }

        let bounds = [];
        let rutePerUser = {};

        // 1. Kelompokkan koordinat berdasarkan user_id
        data.forEach(item => {
          const userId = item.user_id || 'Tanpa Nama';
          if (!rutePerUser[userId]) {
            rutePerUser[userId] = [];
          }
          if (item.latitude && item.longitude) {
            rutePerUser[userId].push({
              lat: item.latitude,
              lng: item.longitude,
              waktu: new Date(item.created_at).toLocaleString('id-ID')
            });
          }
        });

        // 2. Isi data ke Tabel (Urutan terbaru di atas)
        const dataReversed = [...data].reverse();
        dataReversed.forEach(item => {
          const waktu = new Date(item.created_at).toLocaleString('id-ID');
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${waktu}</td>
            <td><b>${item.user_id || 'Tanpa Nama'}</b></td>
            <td>${item.latitude}</td>
            <td>${item.longitude}</td>
          `;
          tbody.appendChild(row);
        });

        // 3. Gambar Garis & Marker Titik Perjalanan per Karyawan
        let indexWarna = 0;
        Object.keys(rutePerUser).forEach(userId => {
          const titikLokasi = rutePerUser[userId];
          if (titikLokasi.length === 0) return;

          const warnaGaris = warnaKaryawan[indexWarna % warnaKaryawan.length];
          indexWarna++;

          const latLngs = titikLokasi.map(t => [t.lat, t.lng]);

          // --- GARIS RUTE ALA GOJEK (DUAL-LAYER) ---
          if (latLngs.length > 1) {
            // Layer 1: Outline Putih Tebal
            const outlinePolyline = L.polyline(latLngs, { 
              color: '#ffffff', 
              weight: 8, 
              opacity: 0.9,
              lineCap: 'round',
              lineJoin: 'round'
            });
            markersGroup.addLayer(outlinePolyline);

            // Layer 2: Garis Warna Utama
            const polyline = L.polyline(latLngs, { 
              color: warnaGaris, 
              weight: 5, 
              opacity: 1.0,
              lineCap: 'round',
              lineJoin: 'round'
            });
            markersGroup.addLayer(polyline);
          }

          // --- MARKER AWAL, SINGGAH, & AKHIR ---
          titikLokasi.forEach((pos, index) => {
            
            // A. Titik Awal Keberangkatan (Lingkaran Hijau)
            if (index === 0 && titikLokasi.length > 1) {
              const startMarker = L.circleMarker([pos.lat, pos.lng], {
                radius: 8,
                fillColor: "#28a745",
                color: "#ffffff",
                weight: 3,
                opacity: 1,
                fillOpacity: 1
              }).bindPopup(`<b>${userId}</b><br>🟢 <b>Titik Awal Berangkat</b><br>Waktu: ${pos.waktu}`);
              
              markersGroup.addLayer(startMarker);
            } 
            
            // B. Posisi Terakhir / Terkini Saat Ini (Pin Merah Utama)
            else if (index === titikLokasi.length - 1) {
              const endMarker = L.marker([pos.lat, pos.lng])
                .bindPopup(`<b>${userId}</b><br>🔴 <b>Posisi Terakhir</b><br>Total Singgah: ${titikLokasi.length} titik<br>Waktu: ${pos.waktu}`);
              
              markersGroup.addLayer(endMarker);
            } 
            
            // C. Titik Singgah / Berhenti di Tengah Perjalanan (Lingkaran Kuning)
            else {
              const stopMarker = L.circleMarker([pos.lat, pos.lng], {
                radius: 5,
                fillColor: "#ffc107",
                color: "#ffffff",
                weight: 2,
                opacity: 0.8,
                fillOpacity: 0.9
              }).bindPopup(`<b>${userId}</b><br>🟡 <b>Titik Singgah ke-${index + 1}</b><br>Waktu: ${pos.waktu}`);
              
              markersGroup.addLayer(stopMarker);
            }

          });

          latLngs.forEach(ll => bounds.push(ll));
        });

        // Auto-zoom hanya saat pertama kali web dibuka
        if (isFirstLoad && bounds.length > 0) {
          map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
          isFirstLoad = false;
        }

      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" style="color:red;">Gagal memuat data: ${err.message}</td></tr>`;
      }
    }

    // Jalankan pertama kali dan set auto-refresh 5 detik
    muatData();
    setInterval(muatData, 5000);
  </script>

</body>
</html>
