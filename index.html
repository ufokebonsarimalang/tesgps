<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Monitoring Lokasi Karyawan</title>
  
  <!-- Font Google Inter (Sangat Jernih & Modern) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- CSS Leaflet Peta -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }

    body { 
      background-color: var(--bg-main); 
      color: var(--text-main);
      padding: 28px 24px;
      -webkit-font-smoothing: antialiased;
    }

    .dashboard-container {
      max-width: 1280px;
      margin: 0 auto;
    }

    /* HEADER DASHBOARD */
    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .title-area h2 { 
      color: var(--text-main); 
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-area p.subtitle { 
      color: var(--text-muted); 
      font-size: 14px;
      font-weight: 400;
      margin-top: 4px;
    }

    /* STATS SUMMARY BAR */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px 20px;
    }

    .stat-card .label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-card .value {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 6px;
    }

    /* BUTTON STYLING */
    .btn-refresh { 
      padding: 10px 20px; 
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white; 
      border: none; 
      cursor: pointer; 
      border-radius: 10px; 
      font-weight: 600; 
      font-size: 14px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-refresh:hover { 
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
    }

    /* PETA CONTAINER */
    #map { 
      height: 500px; 
      width: 100%; 
      border-radius: 18px; 
      margin-bottom: 28px; 
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border-color);
    }

    /* TABEL DATA */
    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .table-container {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    table { 
      width: 100%; 
      border-collapse: collapse; 
      color: #cbd5e1;
      font-size: 14px;
    }

    th { 
      background-color: #0f172a; 
      color: var(--text-muted); 
      font-weight: 600;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.8px;
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      text-align: left;
    }

    td { 
      padding: 14px 16px; 
      border-bottom: 1px solid #283548; 
      text-align: left; 
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td { 
      background-color: #26334d; 
    }

    .user-badge {
      display: inline-block;
      padding: 4px 10px;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
    }

    .coord-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #94a3b8;
    }

    .time-text {
      font-weight: 500;
      color: #f1f5f9;
    }

    /* POPUP LEAFLET MODERN */
    .leaflet-popup-content-wrapper {
      background: #ffffff !important;
      color: #0f172a !important;
      border-radius: 14px !important;
      padding: 6px 8px !important;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3) !important;
    }

    .leaflet-popup-tip {
      background: #ffffff !important;
    }

    .popup-card {
      padding: 4px;
      min-width: 180px;
      font-family: 'Inter', sans-serif;
    }

    .popup-card .user-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .popup-card .status-tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .tag-start { background: #dcfce7; color: #15803d; }
    .tag-stop { background: #fef9c3; color: #a16207; }
    .tag-end { background: #fee2e2; color: #b91c1c; }

    .popup-card .info-row {
      font-size: 12px;
      color: #475569;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    
    <!-- HEADER -->
    <div class="header-container">
      <div class="title-area">
        <h2>🗺️ Live Tracking Dashboard</h2>
        <p class="subtitle">Pantau pergerakan & posisi titik karyawan secara real-time hari ini</p>
      </div>
      <button class="btn-refresh" onclick="muatData()">
        <span>🔄 Refresh Data</span>
      </button>
    </div>

    <!-- CARDS STATISTIK -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">Karyawan Aktif Hari Ini</div>
        <div class="value" id="statKaryawan">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Total Titik Terkirim</div>
        <div class="value" id="statTitik">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Pembaruan Terakhir</div>
        <div class="value" id="statUpdate" style="font-size: 16px; margin-top: 10px;">-</div>
      </div>
    </div>

    <!-- PETA MONITORING -->
    <div id="map"></div>

    <!-- TABEL RIWAYAT -->
    <div class="section-title">📋 Riwayat Absen & Lokasi Terkini</div>
    
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Waktu Kirim</th>
            <th>ID / Nama Karyawan</th>
            <th>Latitude</th>
            <th>Longitude</th>
          </tr>
        </thead>
        <tbody id="tabel-data">
          <tr><td colspan="4" style="text-align: center; color: #94a3b8; padding: 24px;">Memuat data lokasi...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- JS LEAFLET -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const SUPABASE_URL = "https://gjwuxgoyaaedlgmvjfoh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6fqAKuhYh6qXFPTQi5g3hg_Md9Q7Pjb";

    let isFirstLoad = true;

    // Inisialisasi Peta
    const map = L.map('map').setView([-2.5489, 118.0149], 5);
    
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© OpenStreetMap contributors'
}).addTo(map);
    let markersGroup = L.layerGroup().addTo(map);
    const warnaKaryawan = ['#2563eb', '#10b981', '#ec4899', '#f59e0b', '#8b5cf6', '#06b6d4'];

    async function muatData() {
      const tbody = document.getElementById('tabel-data');
      
      try {
        const today = new Date().toISOString().split('T')[0];

        const response = await fetch(`${SUPABASE_URL}/rest/v1/lokasi_karyawan?select=*&created_at=gte.${today}&order=created_at.asc`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });

        const data = await response.json();
        tbody.innerHTML = '';
        markersGroup.clearLayers();

        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#94a3b8; padding: 24px;">Belum ada data masuk untuk hari ini.</td></tr>';
          document.getElementById('statKaryawan').innerText = '0';
          document.getElementById('statTitik').innerText = '0';
          document.getElementById('statUpdate').innerText = 'Belum Ada';
          return;
        }

        // Update Stat Cards
        document.getElementById('statTitik').innerText = data.length;
        document.getElementById('statUpdate').innerText = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB';

        let bounds = [];
        let rutePerUser = {};

        data.forEach(item => {
          const userId = item.user_id || 'Tanpa Nama';
          if (!rutePerUser[userId]) rutePerUser[userId] = [];

          if (item.latitude && item.longitude) {
            rutePerUser[userId].push({
              lat: item.latitude,
              lng: item.longitude,
              waktu: new Date(item.created_at).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
            });
          }
        });

        document.getElementById('statKaryawan').innerText = Object.keys(rutePerUser).length;

        // Render Tabel (Urut Terbaru Di Atas)
        const dataReversed = [...data].reverse();
        dataReversed.forEach(item => {
          const waktu = new Date(item.created_at).toLocaleString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><span class="time-text">${waktu} WIB</span></td>
            <td><span class="user-badge">${item.user_id || 'Tanpa Nama'}</span></td>
            <td><span class="coord-text">${item.latitude}</span></td>
            <td><span class="coord-text">${item.longitude}</span></td>
          `;
          tbody.appendChild(row);
        });

        // Render Rute & Marker Peta
        let indexWarna = 0;
        Object.keys(rutePerUser).forEach(userId => {
          const titikLokasi = rutePerUser[userId];
          if (titikLokasi.length === 0) return;

          const warnaGaris = warnaKaryawan[indexWarna % warnaKaryawan.length];
          indexWarna++;

          const latLngs = titikLokasi.map(t => [t.lat, t.lng]);

          if (latLngs.length > 1) {
            const outlinePolyline = L.polyline(latLngs, { color: '#ffffff', weight: 6, opacity: 0.8, lineCap: 'round' });
            const polyline = L.polyline(latLngs, { color: warnaGaris, weight: 4, opacity: 1.0, lineCap: 'round' });
            markersGroup.addLayer(outlinePolyline);
            markersGroup.addLayer(polyline);
          }

          titikLokasi.forEach((pos, index) => {
            if (index === 0 && titikLokasi.length > 1) {
              const startMarker = L.circleMarker([pos.lat, pos.lng], {
                radius: 7, fillColor: "#10b981", color: "#ffffff", weight: 3, opacity: 1, fillOpacity: 1
              }).bindPopup(`
                <div class="popup-card">
                  <div class="user-title">👤 ${userId}</div>
                  <span class="status-tag tag-start">🟢 Titik Awal Berangkat</span>
                  <div class="info-row">⏰ Jam: <b>${pos.waktu} WIB</b></div>
                </div>
              `);
              markersGroup.addLayer(startMarker);
            } 
            else if (index === titikLokasi.length - 1) {
              const endMarker = L.marker([pos.lat, pos.lng])
                .bindPopup(`
                  <div class="popup-card">
                    <div class="user-title">👤 ${userId}</div>
                    <span class="status-tag tag-end">🔴 Posisi Terakhir</span>
                    <div class="info-row">📍 Total Singgah: <b>${titikLokasi.length} titik</b></div>
                    <div class="info-row">⏰ Update: <b>${pos.waktu} WIB</b></div>
                  </div>
                `);
              markersGroup.addLayer(endMarker);
            } 
            else {
              const stopMarker = L.circleMarker([pos.lat, pos.lng], {
                radius: 5, fillColor: "#f59e0b", color: "#ffffff", weight: 2, opacity: 0.9, fillOpacity: 1
              }).bindPopup(`
                <div class="popup-card">
                  <div class="user-title">👤 ${userId}</div>
                  <span class="status-tag tag-stop">🟡 Singgah ke-${index + 1}</span>
                  <div class="info-row">⏰ Jam: <b>${pos.waktu} WIB</b></div>
                </div>
              `);
              markersGroup.addLayer(stopMarker);
            }
          });

          latLngs.forEach(ll => bounds.push(ll));
        });

        if (isFirstLoad && bounds.length > 0) {
          map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
          isFirstLoad = false;
        }

      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" style="color:#ef4444; text-align:center; padding: 24px;">Gagal memuat data: ${err.message}</td></tr>`;
      }
    }

    muatData();
    setInterval(muatData, 5000);
  </script>

</body>
</html>
