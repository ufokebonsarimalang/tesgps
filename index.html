<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoring Lokasi Karyawan</title>
  
  <!-- CSS Leaflet Peta -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
    h2 { color: #333; margin-bottom: 5px; }
    p.subtitle { color: #666; margin-top: 0; margin-bottom: 20px; }
    #map { height: 420px; width: 100%; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
    th { background-color: #007bff; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    .btn { padding: 10px 15px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px; margin-bottom: 15px; }
    .btn:hover { background: #218838; }
  </style>
</head>
<body>

  <h2>Dashboard Monitoring Lokasi Karyawan</h2>
  <p class="subtitle">Menampilkan posisi terakhir & garis rute pergerakan karyawan secara real-time.</p>
  
  <button class="btn" onclick="muatData()">Refresh Data</button>

  <!-- Peta -->
  <div id="map"></div>

  <h3>Riwayat Pengiriman Lokasi</h3>
  <table>
    <thead>
      <tr>
        <th>Waktu Kirim</th>
        <th>User ID / Nama Karyawan</th>
        <th>Latitude</th>
        <th>Longitude</th>
      </tr>
    </thead>
    <tbody id="tabel-data">
      <tr><td colspan="4">Memuat data...</td></tr>
    </tbody>
  </table>

  <!-- JS Leaflet Peta -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const SUPABASE_URL = "https://gjwuxgoyaaedlgmvjfoh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6fqAKuhYh6qXFPTQi5g3hg_Md9Q7Pjb";

    // Inisialisasi Peta
    const map = L.map('map').setView([-2.5489, 118.0149], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let markersGroup = L.layerGroup().addTo(map);

    // Daftar warna dinamis untuk membedakan garis rute tiap karyawan
    const warnaKaryawan = ['#007bff', '#e83e8c', '#28a745', '#fd7e14', '#6f42c1', '#17a2b8'];

    async function muatData() {
      const tbody = document.getElementById('tabel-data');
      
      try {
        // Ambil data diurutkan dari waktu LAMA ke BARU untuk keperluan pembuatan garis rute
        const response = await fetch(`${SUPABASE_URL}/rest/v1/lokasi_karyawan?select=*&order=created_at.asc`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });

        const data = await response.json();
        tbody.innerHTML = '';
        markersGroup.clearLayers(); // Hapus marker & garis lama

        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4">Belum ada data masuk.</td></tr>';
          return;
        }

        let bounds = [];
        let rutePerUser = {}; // Mengelompokkan koordinat berdasarkan user_id

        // 1. Kelompokkan koordinat per karyawan
        data.forEach(item => {
          const userId = item.user_id || 'Tanpa Nama';
          if (!rutePerUser[userId]) {
            rutePerUser[userId] = [];
          }
          if (item.latitude && item.longitude) {
            rutePerUser[userId].push({
              lat: item.latitude,
              lng: item.longitude,
              waktu: new Date(item.created_at).toLocaleString('id-ID')
            });
          }
        });

        // 2. Tampilkan di Tabel (Diurutkan dari terbaru untuk kemudahan dibaca)
        const dataReversed = [...data].reverse();
        dataReversed.forEach(item => {
          const waktu = new Date(item.created_at).toLocaleString('id-ID');
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${waktu}</td>
            <td><b>${item.user_id || 'Tanpa Nama'}</b></td>
            <td>${item.latitude}</td>
            <td>${item.longitude}</td>
          `;
          tbody.appendChild(row);
        });

        // 3. Gambar Garis Rute (Polyline) & Marker Posisi Terakhir per Karyawan
        let indexWarna = 0;
        Object.keys(rutePerUser).forEach(userId => {
          const titikLokasi = rutePerUser[userId];
          if (titikLokasi.length === 0) return;

          const warnaGaris = warnaKaryawan[indexWarna % warnaKaryawan.length];
          indexWarna++;

          // Kumpulkan koordinat [lat, lng] untuk garis
          const latLngs = titikLokasi.map(t => [t.lat, t.lng]);

          // Gambar garis rute jika titik lokasi lebih dari 1
          if (latLngs.length > 1) {
            const polyline = L.polyline(latLngs, { color: warnaGaris, weight: 4, opacity: 0.7 });
            markersGroup.addLayer(polyline);
          }

          // Pasang Marker HANYA pada posisi TERAKHIR (paling ujung rute)
          const posisiTerakhir = titikLokasi[titikLokasi.length - 1];
          const marker = L.marker([posisiTerakhir.lat, posisiTerakhir.lng])
            .bindPopup(`<b>${userId}</b><br>Jumlah Titik: ${titikLokasi.length}<br>Terakhir Update:<br>${posisiTerakhir.waktu}`);

          markersGroup.addLayer(marker);

          // Masukkan koordinat untuk memfokuskan peta
          latLngs.forEach(ll => bounds.push(ll));
        });

        // Pas-kan zoom peta agar seluruh rute terlihat
        if (bounds.length > 0) {
          map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
        }

      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" style="color:red;">Gagal memuat data: ${err.message}</td></tr>`;
      }
    }

    // Panggil fungsi utama
    muatData();
    setInterval(muatData, 5000);
  </script>

</body>
</html>
